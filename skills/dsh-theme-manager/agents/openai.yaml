interface:
  display_name: "DSH Theme Manager"
  short_description: "Safely install, verify, and roll back DSH themes"
  default_prompt: "Use $dsh-theme-manager only after official DSH has completed a separate first-start task and Finder has validated the exact public #ID shown at the top-left of the selected card or detail page. Reject legacy DSH-* labels and any ID, slug, package, version, URL, or digest mismatch. Keep technical coordinates internal, then validate, install, cold-restart, and preserve rollback. RC.2 is a certified runtime baseline only; never treat it as item authority or silently downgrade to RC.8."
