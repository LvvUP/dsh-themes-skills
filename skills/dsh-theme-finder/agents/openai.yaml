interface:
  display_name: "DSH Theme Finder"
  short_description: "Classify hosted, community, and showcase directory records"
  default_prompt: "Use $dsh-theme-finder to resolve the exact public four-digit DSH-Themes #NNNN shown at the top-left of its card or detail page. Normalize legacy ui-extension input to the canonical plugin kind. Reject #1, #0001, #10000, DSH-1001, DSH-2206, DSH-FS-009, and every other malformed, legacy, or internal label as an installation ID. Treat names, slugs, and detail URLs as discovery-only until I confirm the #NNNN. Derive technical coordinates internally and keep DSH setup separate. Keep all 11 community skins showcase-only with no handoff while alpha.2 re-certification is 0/66 tasks. Alpha.1 and RC evidence are historical only."
