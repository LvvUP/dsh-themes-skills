<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">DSH Themes public ID to responsible installer</title>
  <desc id="desc">A public four-digit ID is resolved by DSH Theme Finder and routed to Theme Manager, Community Skin Installer, or Plugin Installer. Harness setup is a separate no-ID lane. Every route stops without mutation when exact authority is missing.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5EE2B8"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#789198"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="28" fill="#071015"/>
  <path d="M48 88H1152M48 468H1152" stroke="#253A41" stroke-width="2"/>

  <text x="48" y="52" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="30" font-weight="700">One public ID. One responsible installer.</text>
  <text x="48" y="80" fill="#94A8AE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">一个公开编号，只路由到负责该类型的安装器</text>

  <g id="public-id">
    <rect x="48" y="156" width="162" height="164" rx="18" fill="#102028" stroke="#3D5861" stroke-width="2"/>
    <text x="72" y="192" fill="#94A8AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1">PUBLIC INPUT</text>
    <text x="72" y="246" fill="#5EE2B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="38" font-weight="700">#NNNN</text>
    <text x="72" y="282" fill="#DDE7E5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">公开编号</text>
  </g>

  <g id="finder">
    <rect x="258" y="156" width="246" height="164" rx="18" fill="#102028" stroke="#5EE2B8" stroke-width="2"/>
    <text x="282" y="192" fill="#94A8AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1">READ-ONLY</text>
    <text x="282" y="232" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="25" font-weight="700">DSH Theme Finder</text>
    <text x="282" y="270" fill="#DDE7E5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">类型 · 状态 · 精确权威</text>
    <text x="282" y="300" fill="#94A8AE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">kind · status · authority</text>
  </g>

  <g id="installers">
    <rect x="562" y="112" width="236" height="94" rx="16" fill="#102028" stroke="#3D5861" stroke-width="2"/>
    <text x="584" y="145" fill="#94A8AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">#1xxx · hosted #2xxx</text>
    <text x="584" y="178" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700">Theme Manager</text>

    <rect x="562" y="224" width="236" height="94" rx="16" fill="#102028" stroke="#3D5861" stroke-width="2"/>
    <text x="584" y="251" fill="#94A8AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">community #2xxx</text>
    <text x="584" y="280" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">Community Skin</text>
    <text x="584" y="306" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">Installer</text>

    <rect x="562" y="336" width="236" height="94" rx="16" fill="#102028" stroke="#3D5861" stroke-width="2"/>
    <text x="584" y="369" fill="#94A8AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">#3xxx</text>
    <text x="584" y="402" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700">Plugin Installer</text>
  </g>

  <g id="transaction-gate">
    <rect x="858" y="136" width="294" height="204" rx="18" fill="#102028" stroke="#F6C65B" stroke-width="2"/>
    <text x="882" y="170" fill="#F6C65B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1">EXACT GATE</text>
    <text x="882" y="204" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">Preflight → consent</text>
    <text x="882" y="232" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">Snapshot → probe</text>
    <text x="882" y="268" fill="#DDE7E5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">预检 → 同意 → 快照 → 探测</text>
    <text x="882" y="302" fill="#F6C65B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="700">Missing authority: STOP</text>
    <text x="882" y="328" fill="#F6C65B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="700">缺少权威：不修改</text>
  </g>

  <path d="M210 238H258" stroke="#5EE2B8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M504 238H532V159H562" fill="none" stroke="#5EE2B8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M504 238H532V271H562" fill="none" stroke="#5EE2B8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M504 238H532V383H562" fill="none" stroke="#5EE2B8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M798 159H828V238H858" fill="none" stroke="#5EE2B8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M798 271H858" fill="none" stroke="#5EE2B8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M798 383H828V238H858" fill="none" stroke="#5EE2B8" stroke-width="3" marker-end="url(#arrow)"/>

  <g id="harness-separate-lane">
    <rect x="48" y="500" width="1104" height="86" rx="16" fill="#0C1920" stroke="#3D5861" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="72" y="535" fill="#94A8AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">NO CATALOG ID · 独立配置通道</text>
    <text x="72" y="566" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700">Harness setup</text>
    <path d="M252 548H326" stroke="#789198" stroke-width="3" marker-end="url(#arrow-muted)"/>
    <text x="354" y="556" fill="#F4F7F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700">DSH Harness Installer</text>
    <path d="M630 548H704" stroke="#789198" stroke-width="3" marker-end="url(#arrow-muted)"/>
    <text x="732" y="536" fill="#DDE7E5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">official npm runtime</text>
    <text x="732" y="566" fill="#94A8AE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">+ separate exact source cross-build</text>
  </g>

  <circle cx="57" cy="613" r="6" fill="#F6C65B"/>
  <text x="76" y="620" fill="#94A8AE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">Current alpha.2 gates: Harness 0/6 · Plugins 0/80 · no ordinary install claim</text>
</svg>
