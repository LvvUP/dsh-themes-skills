name: One isolated Plugin runtime task
description: Runs exactly one candidate on exactly one alpha.2 platform/Node tuple

inputs:
  batch-id:
    required: true
  catalog-id:
    required: true
  repository:
    required: true
  commit:
    required: true
  tuple:
    required: true
  node-version:
    required: true

runs:
  using: composite
  steps:
    - name: Check out the exact untrusted candidate without credentials
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.commit }}
        path: .ci/candidate
        fetch-depth: 1
        persist-credentials: false

    - name: Check out the exact official alpha.2 source without credentials
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: deepseek-ai/deepseek-harness
        ref: dsh-v0.1.2-alpha.2
        path: .ci/upstream
        fetch-depth: 1
        fetch-tags: true
        persist-credentials: false

    - name: Install the exact tuple Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: authority/package-lock.json

    - name: Install verifier dependencies without lifecycle scripts
      shell: bash
      working-directory: authority
      run: npm ci --ignore-scripts

    - name: Verify both immutable Git identities
      shell: bash
      run: |
        test "$(git -C .ci/candidate rev-parse HEAD)" = "${{ inputs.commit }}"
        test "$(git -C .ci/upstream rev-parse HEAD)" = "0a53fb55bea101816fa226bb964ae2bed71c343b"
        test "$(git -C .ci/upstream rev-parse HEAD^{tree})" = "64ccbfa8e0caa4711cd4a75717ef9e022657961b"
        node authority/skills/dsh-harness-installer/scripts/verify-source.mjs \
          --source "${{ github.workspace }}/.ci/upstream"

    - name: Build the official alpha.2 source for this tuple
      shell: bash
      run: |
        node authority/skills/dsh-harness-installer/scripts/build-source.mjs \
          --source "${{ github.workspace }}/.ci/upstream" \
          --receipt "${{ runner.temp }}/alpha2-private-build-receipt.json" >/dev/null

    - name: Require a reviewed true functional probe before candidate execution
      shell: bash
      run: |
        node authority/skills/dsh-plugin-installer/scripts/plugin-runtime-fixed-executor.mjs \
          --catalog-id "${{ inputs.catalog-id }}" \
          --candidate-source "${{ github.workspace }}/.ci/candidate" \
          --harness-source "${{ github.workspace }}/.ci/upstream" \
          --build-receipt "${{ runner.temp }}/alpha2-private-build-receipt.json" \
          --artifact-output "${{ runner.temp }}/candidate-artifact.tgz" \
          --output "${{ runner.temp }}/plugin-runtime-stage-evidence.json" \
          --tuple "${{ inputs.tuple }}"

    - name: Seal install, start, functional, remove, and rollback evidence
      shell: bash
      run: |
        mkdir -p "${{ runner.temp }}/plugin-runtime-receipt"
        node authority/skills/dsh-plugin-installer/scripts/plugin-runtime-certification.mjs seal \
          --artifact "${{ runner.temp }}/candidate-artifact.tgz" \
          --candidate-source "${{ github.workspace }}/.ci/candidate" \
          --evidence "${{ runner.temp }}/plugin-runtime-stage-evidence.json" \
          --output "${{ runner.temp }}/plugin-runtime-receipt/${{ inputs.catalog-id }}-${{ inputs.tuple }}.json" \
          --workflow "${{ github.workspace }}/authority/.github/workflows/alpha2-plugin-runtime-certification.yml" \
          --catalog-id "${{ inputs.catalog-id }}" \
          --tuple "${{ inputs.tuple }}"

    - name: Upload only this job's sanitized receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: plugin-runtime-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.catalog-id }}-${{ inputs.tuple }}
        path: ${{ runner.temp }}/plugin-runtime-receipt/${{ inputs.catalog-id }}-${{ inputs.tuple }}.json
        if-no-files-found: error
        retention-days: 7
        compression-level: 9
