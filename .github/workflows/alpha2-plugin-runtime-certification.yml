name: alpha2 Plugin runtime certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha2-plugin-runtime-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate four disjoint authority batches
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      batch-1: ${{ steps.matrix.outputs.batch-1 }}
      batch-2: ${{ steps.matrix.outputs.batch-2 }}
      batch-3: ${{ steps.matrix.outputs.batch-3 }}
      batch-4: ${{ steps.matrix.outputs.batch-4 }}
    steps:
      - name: Check out machine authority without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact planner Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install verifier dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Expand four exact 20-by-6 matrices
        id: matrix
        shell: bash
        run: |
          node skills/dsh-plugin-installer/scripts/plugin-runtime-batches.mjs plan >/dev/null
          echo "batch-1=$(node skills/dsh-plugin-installer/scripts/plugin-runtime-batches.mjs matrix --batch 1)" >> "$GITHUB_OUTPUT"
          echo "batch-2=$(node skills/dsh-plugin-installer/scripts/plugin-runtime-batches.mjs matrix --batch 2)" >> "$GITHUB_OUTPUT"
          echo "batch-3=$(node skills/dsh-plugin-installer/scripts/plugin-runtime-batches.mjs matrix --batch 3)" >> "$GITHUB_OUTPUT"
          echo "batch-4=$(node skills/dsh-plugin-installer/scripts/plugin-runtime-batches.mjs matrix --batch 4)" >> "$GITHUB_OUTPUT"

  runtime-batch-1:
    name: "B1 #${{ matrix.catalogId }} ${{ matrix.tuple }}"
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.batch-1) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: authority
          persist-credentials: false
      - uses: ./authority/.github/actions/plugin-runtime-task
        with:
          batch-id: ${{ matrix.batchId }}
          catalog-id: ${{ matrix.catalogId }}
          repository: ${{ matrix.repository }}
          commit: ${{ matrix.commit }}
          tuple: ${{ matrix.tuple }}
          node-version: ${{ matrix.nodeVersion }}

  runtime-batch-2:
    name: "B2 #${{ matrix.catalogId }} ${{ matrix.tuple }}"
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.batch-2) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: authority
          persist-credentials: false
      - uses: ./authority/.github/actions/plugin-runtime-task
        with:
          batch-id: ${{ matrix.batchId }}
          catalog-id: ${{ matrix.catalogId }}
          repository: ${{ matrix.repository }}
          commit: ${{ matrix.commit }}
          tuple: ${{ matrix.tuple }}
          node-version: ${{ matrix.nodeVersion }}

  runtime-batch-3:
    name: "B3 #${{ matrix.catalogId }} ${{ matrix.tuple }}"
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.batch-3) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: authority
          persist-credentials: false
      - uses: ./authority/.github/actions/plugin-runtime-task
        with:
          batch-id: ${{ matrix.batchId }}
          catalog-id: ${{ matrix.catalogId }}
          repository: ${{ matrix.repository }}
          commit: ${{ matrix.commit }}
          tuple: ${{ matrix.tuple }}
          node-version: ${{ matrix.nodeVersion }}

  runtime-batch-4:
    name: "B4 #${{ matrix.catalogId }} ${{ matrix.tuple }}"
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.batch-4) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: authority
          persist-credentials: false
      - uses: ./authority/.github/actions/plugin-runtime-task
        with:
          batch-id: ${{ matrix.batchId }}
          catalog-id: ${{ matrix.catalogId }}
          repository: ${{ matrix.repository }}
          commit: ${{ matrix.commit }}
          tuple: ${{ matrix.tuple }}
          node-version: ${{ matrix.nodeVersion }}

  aggregate:
    name: Enforce the exact 80-of-80 six-task gate
    needs: [runtime-batch-1, runtime-batch-2, runtime-batch-3, runtime-batch-4]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && !failure() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out aggregate verifier without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact aggregate Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install verifier dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Download all 480 isolated task receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: plugin-runtime-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/plugin-runtime-input
      - name: Aggregate four batch digests and reject anything below 80-of-80
        shell: bash
        run: |
          node skills/dsh-plugin-installer/scripts/plugin-runtime-certification.mjs aggregate \
            --input "${{ runner.temp }}/plugin-runtime-input" \
            --output "${{ runner.temp }}/plugin-runtime-candidate" \
            --workflow "${{ github.workspace }}/.github/workflows/alpha2-plugin-runtime-certification.yml"
          node skills/dsh-plugin-installer/scripts/plugin-runtime-certification.mjs verify \
            --candidate "${{ runner.temp }}/plugin-runtime-candidate" \
            --workflow "${{ github.workspace }}/.github/workflows/alpha2-plugin-runtime-certification.yml"
      - name: Upload only the verified unsigned aggregate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-runtime-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-runtime-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  sign:
    name: Sign the exact 80-of-80 aggregate bytes
    needs: aggregate
    if: ${{ needs.aggregate.result == 'success' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download only this run's verified aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plugin-runtime-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-runtime-candidate
      - name: Sign receipt-set bytes with GitHub workflow provenance
        id: receipt-set
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/plugin-runtime-candidate/plugin-runtime-receipt-set.json
      - name: Sign the complete durable 480-receipt predicate
        id: evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/plugin-runtime-candidate/plugin-runtime-receipt-set.json
          predicate-type: https://dsh-themes.com/attestations/plugin-alpha2-runtime-evidence/v1
          predicate-path: ${{ runner.temp }}/plugin-runtime-candidate/plugin-runtime-evidence-predicate.json
      - name: Preserve detached bundles without executing repository code
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/plugin-runtime-signed"
          cp "${{ steps.receipt-set.outputs.bundle-path }}" \
            "${{ runner.temp }}/plugin-runtime-signed/plugin-runtime-receipt-set.json.sigstore.json"
          cp "${{ steps.evidence.outputs.bundle-path }}" \
            "${{ runner.temp }}/plugin-runtime-signed/plugin-runtime-evidence-predicate.json.sigstore.json"
      - name: Upload signed bytes for unprivileged verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-runtime-signed-unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/plugin-runtime-candidate
            ${{ runner.temp }}/plugin-runtime-signed
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  verify-signed:
    name: Verify signed 80-of-80 candidate without OIDC
    needs: sign
    if: ${{ needs.sign.result == 'success' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out only the public aggregate verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact verifier Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install verifier dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Download only this run's signed handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plugin-runtime-signed-unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-runtime-signed-handoff
      - name: Install the byte-pinned GitHub CLI verifier
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${{ runner.temp }}/gh.tar.gz" \
            https://github.com/cli/cli/releases/download/v2.93.0/gh_2.93.0_linux_amd64.tar.gz
          echo "02d1290eba130e0b896f3709ffff22e1c75a51475ddb70476a85abc6b5807af0  ${{ runner.temp }}/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "${{ runner.temp }}/gh.tar.gz" -C "${{ runner.temp }}"
          echo "014fcd614de4de5b4a1441d298175684bad99f713d10296c5fcaaba47ac332d1  ${{ runner.temp }}/gh_2.93.0_linux_amd64/bin/gh" | sha256sum --check --strict
      - name: Revalidate aggregate bytes and both immutable attestations
        shell: bash
        run: |
          node skills/dsh-plugin-installer/scripts/plugin-runtime-certification.mjs verify \
            --candidate "${{ runner.temp }}/plugin-runtime-signed-handoff/plugin-runtime-candidate" \
            --workflow "${{ github.workspace }}/.github/workflows/alpha2-plugin-runtime-certification.yml"
          "${{ runner.temp }}/gh_2.93.0_linux_amd64/bin/gh" attestation verify \
            "${{ runner.temp }}/plugin-runtime-signed-handoff/plugin-runtime-candidate/plugin-runtime-receipt-set.json" \
            --bundle "${{ runner.temp }}/plugin-runtime-signed-handoff/plugin-runtime-signed/plugin-runtime-receipt-set.json.sigstore.json" \
            --repo LvvUP/dsh-themes-skills \
            --cert-identity "https://github.com/LvvUP/dsh-themes-skills/.github/workflows/alpha2-plugin-runtime-certification.yml@refs/heads/main" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-ref refs/heads/main \
            --source-digest "${{ github.sha }}" \
            --signer-digest "${{ github.sha }}" \
            --deny-self-hosted-runners >/dev/null
          node skills/dsh-plugin-installer/scripts/plugin-runtime-certification.mjs verify-custom-bundle \
            --bundle "${{ runner.temp }}/plugin-runtime-signed-handoff/plugin-runtime-signed/plugin-runtime-evidence-predicate.json.sigstore.json" \
            --predicate "${{ runner.temp }}/plugin-runtime-signed-handoff/plugin-runtime-candidate/plugin-runtime-evidence-predicate.json"
          "${{ runner.temp }}/gh_2.93.0_linux_amd64/bin/gh" attestation verify \
            "${{ runner.temp }}/plugin-runtime-signed-handoff/plugin-runtime-candidate/plugin-runtime-receipt-set.json" \
            --bundle "${{ runner.temp }}/plugin-runtime-signed-handoff/plugin-runtime-signed/plugin-runtime-evidence-predicate.json.sigstore.json" \
            --repo LvvUP/dsh-themes-skills \
            --cert-identity "https://github.com/LvvUP/dsh-themes-skills/.github/workflows/alpha2-plugin-runtime-certification.yml@refs/heads/main" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --predicate-type https://dsh-themes.com/attestations/plugin-alpha2-runtime-evidence/v1 \
            --source-ref refs/heads/main \
            --source-digest "${{ github.sha }}" \
            --signer-digest "${{ github.sha }}" \
            --deny-self-hosted-runners >/dev/null
      - name: Upload verified signed aggregate convenience copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-runtime-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-runtime-signed-handoff
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
