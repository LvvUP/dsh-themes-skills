name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Confirm the nested runner starts unbootstrapped
        run: test ! -d skills/dsh-theme-manager/runtime/node_modules
      - name: Test the advertised clean-clone workflow
        run: npm test
      - run: npm run validate
