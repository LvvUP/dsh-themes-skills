name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.19.0, 24.15.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Confirm both historical and current runners start unbootstrapped
        run: node -e "const fs=require('node:fs'); for (const p of ['skills/dsh-theme-manager/runtime/node_modules','skills/dsh-theme-manager/runtime-rc8/node_modules']) if (fs.existsSync(p)) process.exit(1)"
      - name: Test the advertised clean-clone workflow
        run: npm test
      - run: npm run validate
