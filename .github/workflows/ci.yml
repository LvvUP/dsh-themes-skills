name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bootstrap the attested DSH runner
        working-directory: skills/dsh-theme-manager/runtime
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run validate
      - run: npm test
