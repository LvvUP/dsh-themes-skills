name: alpha1 Plugin hosted adaptations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/alpha1-plugin-hosted-adaptations.yml
      - skills/dsh-plugin-installer/assets/hosted-adaptations/**
      - skills/dsh-plugin-installer/references/plugin-hosted-adaptation.schema.json
      - skills/dsh-plugin-installer/references/plugin-runtime-build-recipes/**
      - skills/dsh-plugin-installer/references/plugin-runtime-probe.schema.json
      - skills/dsh-plugin-installer/references/plugin-runtime-probes/**
      - skills/dsh-plugin-installer/scripts/build-hosted-adaptation.mjs
      - skills/dsh-plugin-installer/scripts/hosted-adaptation-plan.mjs
      - skills/dsh-plugin-installer/scripts/plugin-runtime-probe.mjs
      - test/plugin-hosted-adaptation.test.mjs

permissions:
  contents: read

concurrency:
  group: alpha1-plugin-hosted-adaptations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Freeze hosted adaptation matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      adaptations: ${{ steps.matrix.outputs.adaptations }}
    steps:
      - name: Check out adaptation authority without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact builder Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install exact authority dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Emit digest-bound recipe matrix
        id: matrix
        shell: bash
        run: echo "adaptations=$(node skills/dsh-plugin-installer/scripts/hosted-adaptation-plan.mjs matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: "Build-only hosted adaptation #${{ matrix.catalogId }}"
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.adaptations) }}
    steps:
      - name: Check out adaptation authority without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: authority
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact untrusted source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact build-only Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: authority/package-lock.json
      - name: Install exact checked-out authority dependencies without lifecycle scripts
        working-directory: authority
        run: npm ci --ignore-scripts
      - name: Build twice without running candidate code
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/hosted-a" "${{ runner.temp }}/hosted-b"
          node authority/skills/dsh-plugin-installer/scripts/build-hosted-adaptation.mjs \
            --id "#${{ matrix.catalogId }}" \
            --source "${{ github.workspace }}/candidate" \
            --output "${{ runner.temp }}/hosted-a/${{ matrix.assetName }}" \
            --receipt "${{ runner.temp }}/hosted-a/build-receipt.json"
          node authority/skills/dsh-plugin-installer/scripts/build-hosted-adaptation.mjs \
            --id "#${{ matrix.catalogId }}" \
            --source "${{ github.workspace }}/candidate" \
            --output "${{ runner.temp }}/hosted-b/${{ matrix.assetName }}" \
            --receipt "${{ runner.temp }}/hosted-b/build-receipt.json"
          cmp "${{ runner.temp }}/hosted-a/${{ matrix.assetName }}" \
            "${{ runner.temp }}/hosted-b/${{ matrix.assetName }}"
          cmp "${{ runner.temp }}/hosted-a/build-receipt.json" \
            "${{ runner.temp }}/hosted-b/build-receipt.json"
          node -e "const r=JSON.parse(require('node:fs').readFileSync(process.argv[1])); if(r.candidateExecuted!==false||r.publication.installable!==false||r.publication.runtimeCertified!==false) process.exit(1)" \
            "${{ runner.temp }}/hosted-a/build-receipt.json"
      - name: Upload non-installable deterministic staging bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha1-hosted-adaptation-${{ matrix.catalogId }}
          path: ${{ runner.temp }}/hosted-a
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
